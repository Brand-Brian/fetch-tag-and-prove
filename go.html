<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FETCH — taking you to your stay</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(120deg,#EAF7FB,#F2FBF8);font-family:'Archivo',sans-serif;color:#0B3446}
  .card{text-align:center;padding:2rem}
  .word{display:inline-flex;align-items:center;margin-bottom:.9rem;color:#0FA396}
  .word span{font-family:'Pacifico',cursive;font-size:1.7rem;line-height:1;margin:0 .12rem;transform:translateY(-3px);-webkit-text-stroke:.6px currentColor;paint-order:stroke fill}
  .word img{width:34px;height:34px}
  .word .ln{width:19px;height:34px;color:inherit;flex:none}
  p{color:#4A6B78}
  a{color:#0B8177;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="word"><img src="/corgi.png" alt=""><svg class="ln" viewBox="0 0 20 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0 17 C 7 12.5, 13 21.5, 20 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><span>Fetch</span><svg class="ln" viewBox="0 0 20 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0 17 C 7 12.5, 13 21.5, 20 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><img src="/blacklab.png" alt=""></div>
  <p id="msg">Taking you to your stay…</p>
</div>
<script>
const SB_URL = 'https://sqzuvtshebrgzivyzyif.supabase.co';
const SB_KEY = 'sb_publishable_xbumKc7i0RuG4ARzSSB40w_jOuv0ihq';
(async () => {
  const code = new URLSearchParams(location.search).get('c');
  const msg = document.getElementById('msg');
  if (!code){ msg.innerHTML = 'This link is missing its code. <a href="/">Back to FETCH</a>'; return; }
  let sb = null;
  try { sb = supabase.createClient(SB_URL, SB_KEY); } catch(e){}
  let dest = null;
  if (sb){
    try {
      // log the click (don't block the traveler if it fails)
      sb.from('clicks').insert({ code }).then(()=>{});
      const { data } = await sb.from('tags').select('tracked_url').eq('code', code).maybeSingle();
      if (data) dest = data.tracked_url;
    } catch(e){}
  }
  if (dest){ location.replace(dest); }
  else { msg.innerHTML = 'We couldn\'t find that stay. <a href="/">Back to FETCH</a>'; }
})();
</script>
</body>
</html>
